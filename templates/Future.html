<script id="dfc-events-data" type="application/json">[]</script>
<script>
(function() {
  var events = [];
  try {
    events = JSON.parse(document.getElementById('dfc-events-data').textContent) || [];
  } catch (e) { events = []; }

  var currentDate = new Date();
  var viewMonth = currentDate.getMonth();
  var viewYear = currentDate.getFullYear();
  var monthNames = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

  function render() {
    document.getElementById('cal-month-title').textContent =
      monthNames[viewMonth] + ' ' + viewYear;

    var grid = document.getElementById('cal-days');
    grid.innerHTML = '';

    var firstDay = new Date(viewYear, viewMonth, 1).getDay();
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (var i = 0; i < firstDay; i++) {
      var blank = document.createElement('div');
      blank.className = 'cal-cell empty';
      grid.appendChild(blank);
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var cell = document.createElement('div');
      cell.className = 'cal-cell';
      cell.textContent = d;

      var dateStr = viewYear + '-' +
        String(viewMonth + 1).padStart(2, '0') + '-' +
        String(d).padStart(2, '0');

      var hasEvent = events.some(function(e) {
        return dateStr === e.date;
      });
      if (hasEvent) cell.classList.add('has-event');

      var today = new Date();
      if (d === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear()) {
        cell.classList.add('today');
      }

      grid.appendChild(cell);
    }

    var eventsDiv = document.getElementById('cal-events');
    eventsDiv.innerHTML = '';
    var monthEvents = events.filter(function(e) {
      var eStart = new Date(e.date + 'T00:00:00');
      var eEnd = e.end ? new Date(e.end + 'T00:00:00') : eStart;
      return (eStart.getMonth() === viewMonth && eStart.getFullYear() === viewYear) ||
             (eEnd.getMonth() === viewMonth && eEnd.getFullYear() === viewYear);
    });
    monthEvents.forEach(function(e) {
      var div = document.createElement('div');
      div.className = 'cal-event-item';
      var start = new Date(e.date + 'T00:00:00');
      var end = e.end ? new Date(e.end + 'T00:00:00') : null;
      var label = monthNames[start.getMonth()] + ' ' + start.getDate();
      if (end && end.getTime() !== start.getTime()) {
        label += ' – ' + monthNames[end.getMonth()] + ' ' + end.getDate();
      }
      var dateSpan = document.createElement('span');
      dateSpan.className = 'cal-event-date';
      dateSpan.textContent = label;
      div.appendChild(dateSpan);
      div.appendChild(document.createTextNode(' '));
      if (e.link) {
        var a = document.createElement('a');
        a.href = e.link;
        a.target = '_blank';
        a.textContent = e.title;
        div.appendChild(a);
      } else {
        div.appendChild(document.createTextNode(e.title));
      }
      eventsDiv.appendChild(div);
    });
  }

  document.getElementById('cal-prev').addEventListener('click', function() {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  });
  document.getElementById('cal-next').addEventListener('click', function() {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  });

  render();
})();
</script>
